name: Deploy to Cloud Run

on:
  workflow_dispatch:

env:
  REGION: europe-west1
  SERVICE: frontend
  IMAGE: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/frontend/frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build \
            --build-arg VITE_AUTH_URL=${{ secrets.AUTH_SERVICE_URL }} \
            --build-arg VITE_PRODUCT_URL=${{ secrets.PRODUCT_SERVICE_URL }} \
            --build-arg VITE_MESSAGING_URL=${{ secrets.MESSAGING_SERVICE_URL }} \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: --ingress=all --allow-unauthenticated --port=80
